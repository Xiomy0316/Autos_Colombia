# =============================================================================
# Autos Colombia — despliegue con Docker: PostgreSQL externo (Neon) + API
# (FastAPI) + Interfaz (nginx haciendo de reverse proxy de /api).
#
# La cadena de conexión se toma del entorno (.env en local, variables de la
# plataforma en Dokploy/Render). No se levanta PostgreSQL dentro de Docker.
#
#   docker compose up --build
#
# Requiere Docker Desktop (o Docker Engine + plugin compose). Si prefieres
# trabajar con ng serve + uvicorn, sigue usando ./run-local.sh.
# =============================================================================

name: autos-colombia

services:
  backend:
    build:
      context: ./backend
    environment:
      # Pooler de Neon para el tráfico normal de la aplicación.
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL con la cadena del pooler de Neon}
      # Conexión directa usada por Alembic para las migraciones (evita el error
      # de prepared statements del pooler). Si falta, se usa DATABASE_URL.
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      # Firma de los tokens de sesión (mínimo 32 caracteres).
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET para firmar las sesiones}
      # Mismo contrato que en Render: la app escucha en ${PORT}.
      PORT: "8000"
      WEB_CONCURRENCY: "1"
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: "8080"
      # Origen (sin barra final) al que nginx reenvía /api.
      API_URL: http://backend:8000
    expose:
      - "8080"
    depends_on:
      - backend
