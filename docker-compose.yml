# =============================================================================
# Autos Colombia — ejecución local con la MISMA arquitectura que en Render:
# PostgreSQL + API (FastAPI) + Interfaz (nginx haciendo de reverse proxy de /api).
#
#   docker compose up --build
#   Interfaz: http://localhost:8080   ·   API: http://localhost:8000/api/health
#
# Requiere Docker Desktop (o Docker Engine + plugin compose). Si prefieres
# trabajar como hasta ahora con ng serve + uvicorn, sigue usando ./run-local.sh.
# =============================================================================

name: autos-colombia

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: autos
      POSTGRES_PASSWORD: autos
      POSTGRES_DB: autos_colombia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autos -d autos_colombia"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://autos:autos@db:5432/autos_colombia
      # Mismo contrato que en Render: la app escucha en ${PORT}.
      PORT: "8000"
      WEB_CONCURRENCY: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: "8080"
      # Origen (sin barra final) al que nginx reenvía /api.
      API_URL: http://backend:8000
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
